[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''Restoring this planning run is the work of a materials-planning or ERP engineer picking up after a failed rollout, and it is a dependent chain rather than a single repair. All of the data is synthetic: the item numbers, bills of material, holders of demand and the board minutes were generated for this task and describe no real plant, part or person. The rollout left /app/data/inventory_positions.json holding a truncated prefix of the positions, so the first step is to rebuild it by replaying the movement journal onto the pre-rollout snapshot under the board's final recovery decision -- each movement keyed on the item it names, an adjustment overwriting the on-hand in place, a receipt added or cancelled by its own id, a retraction withdrawing the item's position permanently, and a replayed duplicate resolved by the later sequence rather than the first. Which positions survive and what each holds decides the netting of every item, so every planning decision rests on it. Only then can the planning dialect be reconstructed, and the minute book is written the way a planning board actually writes: it records where the board departed from the textbook run and never restates what a low-level code, a lot policy or a lead time means. Five February and March drafts were reversed or revised in the 2026-05 planning review and four more were superseded alongside them, so nine separate rules must each be traced to their FINAL dated decision. The low-level code is the DEEPEST level an item appears at rather than the first the explosion reaches it on; the lead-time offset counts WORKING days rather than raw calendar days; the shortfall is measured up to the safety stock rather than to zero; dependent demand lands on the parent's RELEASE day rather than its receipt day; the lot policy sizes the quantity that must ARRIVE and yield then inflates that arrival into a larger RELEASE, with the projected balance credited only with the arrival; a bill-of-materials line's scrap allowance inflates what that line must issue, driven by the parent's released quantity rather than its arrival; a phantom assembly is netted like any other item but raises no order and passes its remainder down on the day it arose with its own lead time ignored; a line applies only where the parent's RELEASE day falls inside its effectivity window; and a release computed inside an item's firm fence is pushed OUT to the fence day, reported as inside_fence whatever its size and not also reported past due. Those nine interact multiplicatively rather than sitting side by side. Yield and scrap are each applied once at their own level, so down a five-level structure the allowances compound, and an implementation that takes either once at the top diverges by a growing factor at every level. The fence changes a release day, which changes which effectivity window that order falls in, which changes which component is issued at all -- so a wrong fence rule silently swaps parts rather than merely moving a date. The working-day offset feeds the release day that both the effectivity test and the fence comparison turn on. And because the low-level code decides the order items are planned in, getting it wrong corrupts every downstream netting before any of the other eight rules is even reached. The last stage is the one that cannot be approximated. Every planned order occupies its item's run hours at a work centre, a centre starts only so many hours in a working day, and an order a day has no room for is pulled EARLIER rather than pushed later -- the draft that pushed it to the next day was reversed. Days settle from the last working day backwards, so what one day sheds competes for the day before it, and on a contested day the orders that stay are the set whose hours fill the day best rather than the set a pass taking the biggest first happens to keep. A later minute makes that settlement a set problem rather than a knapsack over independent items: each item belongs to a changeover family and a centre pays that family's setup block ONCE a day however many orders of it the centre starts, so what an order costs the day depends on which of its neighbours stay beside it, and the blocks are capacity spent rather than work done -- the set that stays is still the one whose RUN hours total the most, now among the sets whose runs and blocks together fit. Reading a block per order, or maximising the hours the day is charged instead of the hours it runs, each gives a different plan rather than a slightly different one. On the graded batch three hundred and eighteen days are contested and taking the biggest first loads strictly fewer hours on a hundred and six of them, so a greedy loading is a worse answer and not merely another one -- and it cascades, because one day's choice decides what competes on the day before it. Nor can the day be settled by trying every subset: the busiest contested day offers thirty-seven candidates and a tenth of them offer twenty-nine or more, so enumeration is out and the settlement has to be a search over the room left and the families already paid for. The data is synthetic and every figure is an integer.'''
solution_explanation = '''solution/solve.sh drives the two dependent steps inside the environment container. Step one runs solution/recover_positions.go, installed at /app/workflow/recover_positions.go where the instruction requires the replay be left runnable and taking --snapshot, --journal and --out with the operational paths as defaults. It implements the board's final recovery decisions (#MRP-4170 and #MRP-4174): it starts from /app/data/inventory_snapshot_pre_rollout.json, replays /app/data/inventory_movement_journal.json in ascending seq keyed on item id, overwrites the on-hand on an adjustment, adds and cancels scheduled receipts by receipt id, withdraws a retracted item permanently, and writes the survivors over the truncated /app/data/inventory_positions.json ascending by item id carrying only the three declared fields. Step two copies solution/plan_requirements_fixed.go over /app/workflow/plan_requirements.go and runs it. The planner computes each item's low-level code as the deepest level it appears at, by relaxation over the structure (#MRP-4190), plans items in ascending code then item id so every parent's releases are known before its components are netted (#MRP-4192), carries the projected balance forward and measures each shortfall up to the safety stock (#MRP-4200), sizes the arriving quantity by the item's lot policy (#MRP-4205, #MRP-4204), inflates that arrival into a released quantity for the item's own yield while crediting the balance only with the arrival (#MRP-4234), reaches the release day by stepping back over working days (#MRP-4210), pushes a release falling inside the item's firm fence out to the fence day and flags it (#MRP-4250), places dependent demand on the parent's release day (#MRP-4214) through only those bill-of-materials lines effective on that day (#MRP-4246), inflates each line's issue for its scrap allowance off the parent's released quantity (#MRP-4238), blows phantom assemblies through without an order or a lead-time offset (#MRP-4242), and queues past-due, backlog-exceeded and inside-fence exceptions under the reporting and ordering decisions (#MRP-4220, #MRP-4230). It then loads the finished orders against the work centres (#MRP-4256 as amended by #MRP-4260): each order takes its item's run hours at the centre the master names and each distinct changeover family the day starts costs that centre one setup block, days are settled from the last working day backwards with what a day sheds joining the candidates of the day before, and a contested day keeps the subset whose RUN hours total the most among those whose runs and blocks together stay inside the day -- solved by a memoised search over the room left and the families already paid for, rather than a greedy pass or a plain subset sum over run hours -- ties going to the order earlier in the plan order, applied in turn down the candidates. An order that would be pulled past its centre's limit is left on its own release day and queued capacity_exceeded.'''
verification_explanation = '''The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is graded directly: the rebuilt positions must match the sealed digest and record count, carry only the three declared fields with no journal bookkeeping surviving, and leave the snapshot, journal, item master, bill of materials, demand, calendar and policy byte-identical. The verifier re-derives the misreadings of the replay from those same sources -- a plain concatenation, a replay in file order rather than by sequence, and one where a retraction is not permanent -- and requires each to differ from the governed result. Because a delivered file can be right about one world for the wrong reasons, the replay is also graded as behaviour: the verifier compiles the agent's own /app/workflow/recover_positions.go and runs it over snapshots and journals no fixture covers, comparing against a replay implemented independently in the verifier. One of those worlds is derived from the operational sources -- a third of the items, half the movements, and a tail that retracts an item, adjusts it again afterwards, adds and cancels receipts and names an item the snapshot never carried -- and the rest are small crafted instances pinning each governed rule on its own: sequence order over file order, a retraction that a later movement cannot undo, a movement for an unknown item ignored, a cancel that drops the first match and is otherwise a no-op, and the sorted three-field shape. A submission that ships one precomputed positions file and no working replay fails these outright. Step two recompiles the agent's submitted /app/workflow/plan_requirements.go from source with go build rather than trusting any delivered binary, runs it under an unprivileged uid (65534 via setpriv, a scrubbed environment, inputs staged into a candidate-writable work area) on both the recovered positions and a held-out alternate positions file, and compares summary.json in full plus SHA-256 digests of item_plan.json and exception_queue.jsonl against sealed fixtures generated from the reference. Crafted micro-instances pin each of the nine reversed rules independently: one proves the low-level code is the deeper of two encounters, one proves the offset steps over closed days, one proves the shortfall reaches back up to the safety stock, one proves dependent demand lands on the release day, one proves the three lot policies size differently, one proves a short yield over-releases while the balance is credited only with the arrival, one proves yield is applied after the lot policy and not before, one proves a line's scrap inflates what it issues, one proves the explosion is driven by the released quantity, one proves yield and scrap compound down two levels, three prove a phantom raises no order, nets against its own stock and passes through on the day the requirement arose with its own yield applied, two prove effectivity is judged on the release day and that a component with no effective line takes no demand, and four prove the fence pushes a release out over working days, supersedes the past-due report, leaves an unfenced item past due, and thereby moves which effectivity window applies. The finite-capacity stage is graded twice over: the whole cascade is recomputed independently in the verifier from the item master, the capacity file and the calendar, and every order's load day, pull count and placement must agree with it; the loading is separately required to keep no centre over its day's hours, to start nothing on a closed day, and never to move an order later than its release day or further back than its centre allows; and a greedy pass over the graded run's own contested days must load strictly fewer hours on at least one of them, so the exact fit is not a distinction without a difference. Ten crafted instances pin the rule on its own: a phantom occupies nothing, a day of ten hours keeps the six and the four rather than the seven, a tie on hours keeps the order earlier in the plan, a shed order competes on the day before and displaces what it outranks, an order past its pull limit is reported capacity_exceeded at whatever quantity, a closed day starts nothing, the hours and the pull limit are read from the capacity file rather than inlined, three orders of one family cost their day a single block, the same three orders in three families no longer fit it, and a day keeps the pair that RUNS the most rather than the pair it is CHARGED the most for. Whole-run assertions further require that every exception kind occurs, that phantoms and fence pushes are load-bearing rather than absent, and that released and arriving quantities diverge exactly where the item master's yield is short. The policy file is graded on the behaviour it drives rather than on the values echoed back: the exception floor, the past-due grace, the backlog limit and the period-of-supply cap are each varied on their own and required to move the outcome -- the floor decides whether a material order is queued at all, the grace moves the boundary the report is measured from, the backlog limit switches which kind is reported for the same release day, and the cap truncates the span a period-of-supply lot covers, splitting one order into two -- so a planner holding the baselines as constants cannot pass by echoing them into summary.json. The run is timed against the ninety-second budget the contract publishes, a static scan rejects any third-party import over both submitted programs, and the frozen snapshot /app/workflow/.plan_requirements.original.go is asserted present by hash and wrong by output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1, a fresh environment with no solve.sh gives 0, and an environment where the positions are rebuilt but the shipped draft planner is left in place fails 25 tests including every one of the nine rule probes.'''
relevant_experience = '''Working knowledge of materials requirements planning as a discipline -- low-level coding, gross-to- net logic, time-phased projected balances, lot-sizing policies, lead-time offsetting and dependent demand taken as read rather than looked up -- plus experience rebuilding an inventory position set by replaying a movement journal onto a snapshot, and reconstructing a planning dialect from an authoritative but noisy minute book that records only the board's departures from standard practice, tracing incrementally-revised rules to their final form and matching a strict output contract in Go.'''
